<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Decorative Rings -->
  <circle cx="1020" cy="315" r="320" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.15" />
  <circle cx="1020" cy="315" r="240" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.25" stroke-dasharray="10 15" />
  <circle cx="1020" cy="315" r="150" fill="#14b8a6" opacity="0.12" filter="url(#glow)" />

  <!-- Logo Mark Graphic -->
  <g transform="translate(100, 90)">
    <rect width="84" height="84" rx="22" fill="#0d9488" />
    <g fill="#ffffff" transform="translate(18, 18) scale(1)">
      <ellipse cx="13.2" cy="18" rx="3.7" ry="4.8" transform="rotate(-24 13.2 18)"/>
      <ellipse cx="22" cy="13.4" rx="3.7" ry="4.8" transform="rotate(-8 22 13.4)"/>
      <ellipse cx="31.2" cy="15.8" rx="3.7" ry="4.8" transform="rotate(14 31.2 15.8)"/>
      <ellipse cx="37.1" cy="23.1" rx="3.3" ry="4.3" transform="rotate(30 37.1 23.1)"/>
      <path d="M23.8 22.4c-4.9 0-10.1 4.6-10.1 9.3 0 3.6 2.7 5.4 6 4.3 1.4-.5 2.5-.5 3.7 0 3.6 1.2 7.9-.5 9.2-3.6 1.7-4.2-3-10-8.8-10Z"/>
    </g>
    <text x="108" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">DermaScan</text>
    <text x="350" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="600" fill="#5eead4" letter-spacing="0.08em">VETERINARY AI</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Veterinary AI Skin Diagnosis &amp;
  </text>
  <text x="100" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="54" font-weight="800" fill="url(#brandGrad)" letter-spacing="-0.02em">
    Community Animal Rescue Intake
  </text>

  <!-- Subheadline -->
  <text x="100" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">
    Instant on-device neural vision screening across 6 canine dermatological conditions.
  </text>
  <text x="100" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.01em">
    Field-ready report generator, offline emergency map, and zero cloud telemetry.
  </text>

  <!-- Metric Badges -->
  <g transform="translate(100, 500)">
    <!-- Badge 1 -->
    <rect width="240" height="52" rx="14" fill="rgba(15, 118, 110, 0.35)" stroke="#14b8a6" stroke-width="1.5" />
    <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#2dd4bf">
      94.23% Test Accuracy
    </text>

    <!-- Badge 2 -->
    <g transform="translate(260, 0)">
      <rect width="240" height="52" rx="14" fill="rgba(15, 118, 110, 0.35)" stroke="#14b8a6" stroke-width="1.5" />
      <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#2dd4bf">
        0.9943 AUROC Score
      </text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(520, 0)">
      <rect width="260" height="52" rx="14" fill="rgba(15, 118, 110, 0.35)" stroke="#14b8a6" stroke-width="1.5" />
      <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#2dd4bf">
        On-Device WebAssembly
      </text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(800, 0)">
      <rect width="220" height="52" rx="14" fill="rgba(15, 118, 110, 0.35)" stroke="#14b8a6" stroke-width="1.5" />
      <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="17" font-weight="700" fill="#2dd4bf">
        100% Free &amp; Private
      </text>
    </g>
  </g>
</svg>
