<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found — DermaScan</title>
  <meta http-equiv="refresh" content="3; url=/#home">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      max-width: 500px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #ccfbf1;
      color: #0f766e;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 12px;
      color: #0f172a;
    }
    p {
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    a {
      display: inline-block;
      background: #0d9488;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    a:hover {
      background: #0f766e;
    }
    .hint {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">404 Error</div>
    <h1>Page Not Found</h1>
    <p>The page you requested could not be located. You will be redirected to the DermaScan home page shortly.</p>
    <a href="/#home">Return to Home</a>
    <div class="hint">Redirecting automatically in 3 seconds…</div>
  </div>
</body>
</html>
